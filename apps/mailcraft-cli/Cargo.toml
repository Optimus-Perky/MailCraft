[package]
name = "mailcraft-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "MailCraft command line: account lookups and (later) mailbox tools"

[[bin]]
name = "mailcraft-cli"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
mailcraft-autoconfig = { path = "../../crates/mail-autoconfig" }
mailcraft-core = { path = "../../crates/mail-core" }
mail-parser = "0.11"
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
