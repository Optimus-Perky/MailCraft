[package]
name = "mailcraft-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "MailCraft: IMAP connection, folder and message sync, and the local mail cache"

[lints]
workspace = true

[dependencies]
mailcraft-autoconfig = { path = "../mail-autoconfig" }
thiserror = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
mail-parser = "0.11"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "hostname", "tokio1-rustls-tls"] }
ureq = "3"
ring = "0.17"
base64 = "0.22"
serde_json = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
rrule = "0.14"
iana-time-zone = "0.1"
quick-xml = "0.38"
