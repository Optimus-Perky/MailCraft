<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- MailCraft app icon: a postage stamp with an M. Original artwork (MIT OR Apache-2.0). -->
  <rect width="512" height="512" rx="112" fill="#2D4A8A"/>
  <!-- the stamp: a cream square with a perforated edge (circles cut out) -->
  <defs>
    <mask id="perf">
      <rect x="96" y="96" width="320" height="320" fill="white"/>
      <g fill="black">
        <circle cx="96" cy="96" r="13"/><circle cx="160" cy="96" r="13"/><circle cx="224" cy="96" r="13"/><circle cx="288" cy="96" r="13"/><circle cx="352" cy="96" r="13"/><circle cx="416" cy="96" r="13"/>
        <circle cx="96" cy="416" r="13"/><circle cx="160" cy="416" r="13"/><circle cx="224" cy="416" r="13"/><circle cx="288" cy="416" r="13"/><circle cx="352" cy="416" r="13"/><circle cx="416" cy="416" r="13"/>
        <circle cx="96" cy="160" r="13"/><circle cx="96" cy="224" r="13"/><circle cx="96" cy="288" r="13"/><circle cx="96" cy="352" r="13"/>
        <circle cx="416" cy="160" r="13"/><circle cx="416" cy="224" r="13"/><circle cx="416" cy="288" r="13"/><circle cx="416" cy="352" r="13"/>
      </g>
    </mask>
  </defs>
  <rect x="96" y="96" width="320" height="320" fill="#F4EBD9" mask="url(#perf)"/>
  <rect x="134" y="134" width="244" height="244" rx="10" fill="none" stroke="#0B0B0C" stroke-width="10"/>
  <!-- the M: a W turned over -->
  <path d="M172 334 L190 180 L256 300 L322 180 L340 334" fill="none" stroke="#2D4A8A" stroke-width="38" stroke-linejoin="round" stroke-linecap="round"/>
</svg>
